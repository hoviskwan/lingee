<!-- 工作台 -->
<div class="cv-panel active" id="cv-tasks">
  <div class="tb-board-view" id="tb-board-view">
    <div class="tb-heading"><div><h2>工作台</h2><span>让成员与专家围绕同一个目标协作</span></div><span class="tb-demo">演示数据</span></div>
    <div class="tb-toolbar">
      <div class="tb-scopes" role="group" aria-label="任务范围"><button data-tb-scope="all" aria-pressed="true">全部任务</button><button data-tb-scope="mine" aria-pressed="false">我的任务 <span id="tb-mine-count"></span></button><button data-tb-scope="attention" aria-pressed="false">待处理 <span id="tb-attention-count"></span></button></div>
      <div class="tb-tools"><input id="tb-search" name="task-filter-query" type="search" autocomplete="off" data-1p-ignore data-lpignore="true" readonly placeholder="搜索任务或编号…" aria-label="搜索任务或编号"><select id="tb-project" aria-label="按项目筛选任务"><option value="">全部项目</option></select><select id="tb-mode" aria-label="执行模式"><option value="">全部执行模式</option><option>单人执行</option><option>多人协作</option></select><select id="tb-layout" aria-label="任务视图"><option value="board">看板</option><option value="list">列表</option></select><button id="tb-create" class="tb-primary">＋ 新建任务</button></div>
    </div>
    <div class="tb-summary" id="cv-task-stats"></div>
    <div class="scroll tb-scroll"><div id="cv-task-grid"></div><div id="tb-empty" hidden>没有匹配的任务<button id="tb-reset">清除筛选</button></div></div>
  </div>
  <div class="tb-workspace" id="tb-workspace" hidden></div>
</div>
