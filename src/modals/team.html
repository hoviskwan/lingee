<!-- 专家团配置 -->
<div class="modal-overlay" id="teamModal">
  <form class="modal-card env-config-modal team-config-modal" id="teamConfigForm" role="dialog" aria-modal="true" aria-labelledby="teamModalTitle" novalidate>
    <div class="modal-header">
      <div class="env-config-heading"><div class="modal-title" id="teamModalTitle">专家团详情</div></div>
      <button class="modal-close" id="teamModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-tabs team-modal-tabs" role="tablist" aria-label="专家团配置">
      <button type="button" class="modal-tab team-modal-tab active" role="tab" aria-selected="true" data-team-tab="info">基本信息</button>
      <button type="button" class="modal-tab team-modal-tab" role="tab" aria-selected="false" data-team-tab="stages">交付阶段</button>
      <button type="button" class="modal-tab team-modal-tab" role="tab" aria-selected="false" data-team-tab="commands">触发词</button>
    </div>
    <div class="modal-body env-config-body">
      <div class="team-pane" data-team-pane="info" role="tabpanel">
        <div class="team-view-desc hidden" id="teamViewDesc"></div>
        <div id="teamEditFields">
          <div class="team-hint">专家团定义成员和使用方式；执行任务时由 Runtime 动态生成 WorkItem 并路由给合适的专家。</div>
          <section class="env-form-section">
            <div class="env-form-grid">
              <label class="env-field env-field-wide"><span>名称<span class="env-required">*</span></span>
                <input type="text" id="teamName" placeholder="给这个专家团起个名字" autocomplete="off" required></label>
              <label class="env-field env-field-wide"><span>说明</span>
                <textarea id="teamDesc" rows="3" placeholder="它擅长什么、适合什么场景"></textarea></label>
            </div>
          </section>
        </div>
        <section class="env-form-section">
          <div class="env-form-section-title">成员 <span class="team-count" id="teamCount">0</span>
            <span class="team-hint-inline">点名字看定义，星标设组长</span></div>
          <div class="team-members" id="teamMembers"></div>
          <button type="button" class="team-add" id="teamAddBtn">＋ 添加</button>
        </section>
      </div>
      <div class="team-pane hidden" data-team-pane="stages" role="tabpanel">
        <section class="env-form-section">
          <div class="env-form-section-title">交付阶段
            <span class="team-hint-inline">阶段描述交付范围，具体 WorkItem 由 Runtime 动态生成</span></div>
          <div class="team-stages" id="teamStages" role="list" aria-label="交付阶段，从左到右"></div>
        </section>
        <div id="teamWarnings"></div>
      </div>
      <div class="team-pane hidden" data-team-pane="commands" role="tabpanel">
        <section class="env-form-section">
          <div class="env-form-section-title">常见触发词
            <span class="team-hint-inline" id="teamCmdHint">发起对话时会带上第一条</span></div>
          <div class="x-cmd-rows" id="teamCmds"></div>
          <button type="button" class="team-add" id="teamAddCmd">＋ 添加一条</button>
        </section>
      </div>
    </div>
    <div class="modal-footer team-modal-footer">
      <button type="button" class="btn-link team-delete-btn hidden" id="teamDeleteBtn">删除该专家团</button>
      <div class="team-footer-spacer"></div>
      <button type="button" class="modal-btn cancel" id="teamCancelBtn">取消</button>
      <button type="button" class="modal-btn cancel" id="teamCallBtn">发起对话</button>
      <button type="submit" class="modal-btn confirm" id="teamSaveBtn">保存</button>
    </div>
  </form>
</div>
