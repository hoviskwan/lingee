<div class="sync-overlay" id="cv-newtask-overlay" style="display:none" onclick="if(event.target===this)cvCloseNewTask()">
  <div class="nt-modal" role="dialog" aria-modal="true" aria-labelledby="cv-nt-dialog-title">
    <div class="nt-head">
      <div class="nt-crumb"><strong id="cv-nt-dialog-title"><span id="cv-nt-mode-label">手动创建</span></strong></div>
      <div class="nt-head-actions">
        <button type="button" class="nt-expand" id="cv-nt-expand" aria-label="全屏展开"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <button type="button" class="sync-modal__close" aria-label="关闭新增任务" onclick="cvCloseNewTask()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <div class="nt-parent-banner hidden" id="cv-nt-parent-banner">
      <span><span id="cv-nt-parent-label">正在为</span>「<b id="cv-nt-parent-title"></b>」<span id="cv-nt-parent-suffix">新增子任务</span></span>
    </div>
    <div class="nt-body">
      <div class="nt-main" id="cv-nt-manual">
        <label class="nt-field nt-field--title" for="cv-nt-title"><span class="sr-only">任务标题</span><input type="text" autocomplete="off" class="nt-title" id="cv-nt-title" placeholder="任务标题" maxlength="120"></label>
        <label class="nt-field nt-field--desc" for="cv-nt-desc"><span class="sr-only">任务描述</span><textarea class="nt-desc" id="cv-nt-desc" rows="3" placeholder="添加描述..." style="resize:none"></textarea></label>
        <div class="nt-attach-drop nt-attach-drop--desc" id="cv-nt-file-list"></div>
        <div class="nt-expert-field hidden" id="cv-nt-experts-field">
          <div class="nt-section-head"><h3>专家分工 <span id="cv-nt-expert-count"></span></h3><span>为每位专家指定项目成员作为负责人</span></div>
          <div class="nt-expert-bar">
            <span class="nt-expert-team" id="cv-nt-expert-team"></span>
            <button type="button" class="nt-expert-auto" id="cv-nt-expert-auto">按成员依次分配</button>
          </div>
          <div class="nt-expert-list" id="cv-nt-expert-list"></div>
        </div>
      </div>
      <div class="nt-agent hidden" id="cv-nt-agent">
        <section class="nt-draft" aria-labelledby="cv-nt-draft-heading">
          <div class="nt-draft-head"><strong id="cv-nt-draft-heading">任务草稿</strong><span>确认内容后创建</span></div>
          <div class="nt-draft-empty" id="cv-nt-draft-empty">在右侧输入一句话，先生成可编辑的任务草稿。</div>
          <div class="nt-draft-content hidden" id="cv-nt-draft-content">
            <label class="sr-only" for="cv-nt-draft-title">任务标题</label><input type="text" autocomplete="off" id="cv-nt-draft-title" class="nt-draft-title" maxlength="120" placeholder="任务标题">
            <label class="sr-only" for="cv-nt-draft-desc">任务描述</label><textarea id="cv-nt-draft-desc" class="nt-draft-desc" placeholder="任务描述" style="resize:none"></textarea>
          </div>
        </section>
        <aside class="nt-agent-chat" aria-label="一句话创建任务对话">
          <div class="nt-agent-chat-head"><strong>一句话创建任务</strong><span>本地草稿演示</span></div>
          <div class="nt-agent-messages" id="cv-nt-agent-messages" role="log" aria-live="polite"><p class="nt-agent-welcome">说出想完成的事，我会先整理成草稿。你可以继续补充，也可以直接编辑左侧内容。</p></div>
          <div class="nt-agent-composer">
            <label class="sr-only" for="cv-nt-prompt">描述或补充任务</label><textarea id="cv-nt-prompt" rows="3" placeholder="例如：做一个 CRM 客户管理模块" style="resize:none"></textarea>
            <div class="nt-agent-composer-foot"><span>Enter 发送 · Shift+Enter 换行</span><button type="button" id="cv-nt-draft-send" aria-label="发送任务描述">发送</button></div>
          </div>
        </aside>
      </div>
    </div>
    <div class="nt-property-bar" id="cv-nt-properties">
      <span class="nt-property nt-property--status" aria-label="任务状态"><span class="nt-status-ring" aria-hidden="true"></span><span id="cv-nt-status-property">待开始</span></span>
      <label class="nt-property nt-property--priority" for="cv-nt-priority"><span class="sr-only">优先级</span><select id="cv-nt-priority"><option>无优先级</option><option>高</option><option>中</option><option>低</option></select><svg class="nt-pri-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg></label>
      <label class="nt-property nt-property--project" for="cv-nt-project"><span class="sr-only">项目</span><select id="cv-nt-project"></select></label>
      <label class="nt-property nt-property--team" for="cv-nt-team"><span class="sr-only">专家团</span><select id="cv-nt-team" aria-label="专家团"></select></label>
      <label class="nt-property nt-property--group" id="cv-nt-group-field" for="cv-nt-group"><span>上级任务</span><select id="cv-nt-group" aria-label="上级任务（可选）"><option value="">无上级任务</option></select></label>
      <div class="nt-property nt-property--assignee" id="cv-nt-single-field">
        <button type="button" class="nt-person-trigger" id="cv-nt-people-btn" aria-label="负责人">
          <span class="person-avatar-sm" id="cv-nt-people-avatar">人</span>
          <span class="person-name-sm" id="cv-nt-people-name">负责人</span>
          <svg class="nt-person-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <div class="nt-person-menu" id="cv-nt-people-menu" hidden></div>
      </div>
      <div class="nt-property nt-property--tags" id="cv-nt-tags-trigger" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-label="编辑标签"></div>
      <section class="nt-execution" id="cv-nt-execution" aria-labelledby="cv-nt-exec-title">
        <div class="nt-section-head"><h3 id="cv-nt-exec-title" class="sr-only">执行方式（必填）</h3></div>
        <div class="nt-seg" id="cv-nt-exec-mode" role="radiogroup" aria-labelledby="cv-nt-exec-title" aria-required="true">
          <button type="button" class="nt-seg-btn on" data-nt-exec="单人执行" role="radio" aria-checked="true" tabindex="0"><b>单人执行</b></button>
          <button type="button" class="nt-seg-btn" data-nt-exec="多人协作" role="radio" aria-checked="false" tabindex="-1"><b>多人协作</b></button>
        </div>
      </section>
      <div class="nt-more" id="cv-nt-more">
        <button type="button" class="nt-more-trigger" id="cv-nt-more-trigger" aria-label="更多设置" title="更多设置" aria-haspopup="true" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
        <div class="nt-more-body" id="cv-nt-more-body" hidden>
          <div class="nt-field"><span class="nt-label">标签</span><div class="nt-chips" id="cv-nt-tags"><span id="cv-nt-tag-list"></span><button type="button" class="nt-chip nt-chip--add" id="cv-nt-addtag">＋ 添加标签</button></div></div>
        </div>
      </div>
    </div>
    <div class="nt-foot">
      <button type="button" class="nt-attach-trigger" id="cv-nt-attach-trigger" aria-label="添加附件" title="添加附件"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg><span id="cv-nt-attach-count"></span></button>
      <div class="nt-foot-right">
        <button type="button" class="nt-agent-trigger" id="cv-nt-agent-trigger" data-nt-mode="agent" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l-4 4 4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg>切换到智能体</button>
        <button type="button" class="nt-agent-trigger nt-agent-trigger--back hidden" id="cv-nt-manual-trigger" data-nt-mode="manual" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l-4 4 4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg>切换到手动</button>
        <label class="nt-toggle"><input type="checkbox" id="cv-nt-continue-toggle"><span class="nt-toggle-track"></span><span class="nt-toggle-label">继续创建</span></label>
        <button type="button" class="nt-btn nt-btn--primary" id="cv-nt-submit">创建任务</button>
      </div>
    </div>
  </div>
</div>
