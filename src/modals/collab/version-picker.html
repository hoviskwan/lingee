<div class="cv-version-overlay hidden" id="cvVersionOverlay" role="dialog" aria-modal="true" aria-labelledby="cvVersionTitle">
  <div class="cv-version-dialog">
    <button type="button" class="cv-version-close" data-cv-version-close aria-label="关闭">×</button>
    <span class="cv-version-kicker">协作开发</span>
    <h2 id="cvVersionTitle">选择你要进入的任务页面</h2>
    <p>两套页面共用同一份任务数据，可以随时切换比较。</p>
    <div class="cv-version-options">
      <button type="button" class="cv-version-option" data-cv-version="current">
        <span class="cv-version-icon">▦</span>
        <span><strong>当前版本</strong><small>保留现有五类任务看板与全部操作</small></span>
        <em>进入</em>
      </button>
      <button type="button" class="cv-version-option cv-version-option--ai" data-cv-version="ai">
        <span class="cv-version-icon">✦</span>
        <span><strong>AI 任务新版</strong><small>突出异常与待办，紧凑展示执行中和已完成</small></span>
        <em>体验新版</em>
      </button>
    </div>
  </div>
</div>
