<div class="tk-confirm-overlay" id="tkConfirmOverlay" hidden>
  <div class="tk-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="tkConfirmTitle" aria-describedby="tkConfirmMessage">
    <h3 id="tkConfirmTitle">确认删除</h3>
    <p id="tkConfirmMessage"></p>
    <div class="tk-confirm-actions">
      <button type="button" id="tkConfirmCancel">取消</button>
      <button type="button" id="tkConfirmOk">删除</button>
    </div>
  </div>
</div>
