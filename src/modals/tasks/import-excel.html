    <!-- 导入 Excel 弹窗 -->
    <div class="tk-modal-overlay hidden" id="tkImportOverlay">
      <div class="tk-modal tk-import-modal" id="tkImportModal">
        <div class="tk-import-head">
          <h3>导入任务</h3>
          <button class="tk-modal-close" id="tkImportClose" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="tk-import-body">

          <!-- 项目选择 -->
          <div class="tk-import-section">
            <label class="tk-import-label" for="tkImportProject">导入至项目</label>
            <div class="tk-import-select-wrap">
              <select id="tkImportProject" class="tk-import-select"></select>
              <svg class="tk-import-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </div>
          </div>

          <!-- 上传区（默认显示） -->
          <div class="tk-import-drop-zone" id="tkImportDropZone" tabindex="0" role="button" aria-label="点击或拖拽文件到此处上传">
            <input type="file" id="tkImportFileInput" accept=".xlsx,.xls,.csv" hidden>
            <svg class="tk-import-drop-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="13"/><polyline points="9 15 12 12 15 15"/></svg>
            <p class="tk-import-drop-primary">点击或拖拽文件到此处上传</p>
            <p class="tk-import-drop-secondary">支持 .xlsx、.xls、.csv 格式，大小不超过 10 MB</p>
            <button type="button" class="tk-import-tpl-btn" id="tkDownloadTplBtn" tabindex="-1">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              下载 Excel 模板
            </button>
          </div>

          <!-- 已选文件（选中后替换上传区） -->
          <div class="tk-import-file-bar hidden" id="tkImportFileBar">
            <div class="tk-import-file-info">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <div class="tk-import-file-meta">
                <span class="tk-import-file-name" id="tkImportFileName"></span>
                <span class="tk-import-file-size" id="tkImportFileSize"></span>
              </div>
            </div>
            <button type="button" class="tk-import-file-remove" id="tkImportFileRemove" aria-label="重新选择文件">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <!-- 预览表格（解析后显示） -->
          <div class="tk-import-preview hidden" id="tkImportPreview">
            <div class="tk-import-preview-head">
              <span class="tk-import-preview-label" id="tkImportPreviewLabel">预览</span>
              <span class="tk-import-preview-hint" id="tkImportPreviewHint"></span>
            </div>
            <div class="tk-import-table-wrap">
              <table class="tk-import-table" id="tkImportTable">
                <thead id="tkImportTableHead"></thead>
                <tbody id="tkImportTableBody"></tbody>
              </table>
            </div>
          </div>

          <!-- 错误提示 -->
          <div class="tk-import-error hidden" id="tkImportError">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="tkImportErrorMsg"></span>
          </div>


        </div>

        <div class="tk-import-foot">
          <button class="tk-btn-ghost" id="tkImportCancel">取消</button>
          <button class="tk-btn-primary" id="tkImportConfirm" disabled>开始导入</button>
        </div>
      </div>
    </div>
